; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-devkit-v1

[env:esp32-s3]
extra_scripts = pre:tools/build_id.py
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@^1.4.2
build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-s3-ota]
extends = env:esp32-s3
upload_protocol = espota

[env:esp32-s3-supermini]
extends = env:esp32-s3
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = partitions/esp32dev-4mb.csv
board_build.flash_mode = dio
build_flags =
	${env:esp32-s3.build_flags}
	-DOPENSKI_IMU_SDA_PIN=8
	-DOPENSKI_IMU_SCL_PIN=9
	-DOPENSKI_HOSTNAME=\"ski-s3\"
	-DOPENSKI_CAL_S3_SUPERMINI
	; Cell voltage via a 1k/1k divider (+100 nF to GND) on GPIO10 (ADC1_CH9).
	-DOPENSKI_BATTERY_ADC_PIN=10
	-DOPENSKI_BATTERY_DIVIDER_RATIO=2.0f
	; Small-cell power profile: BLE first, Wi-Fi after 5 s at 8.5 dBm, held off on a low cell, 80 MHz CPU.
	-DOPENSKI_LOW_POWER_RADIO

[env:esp32-s3-supermini-ota]
extends = env:esp32-s3-supermini
upload_protocol = espota

; Seeed XIAO ESP32S3 (8 MB flash) with an LSM6DSOX on the default XIAO I2C pins: SDA = D4 = GPIO5,
; SCL = D5 = GPIO6 (Seeed wiki). Untested on hardware. The 4 MB layout is replaced by an 8 MB one with a
; larger recorder partition. No sensor-specific accel/gyro calibration yet (OPENSKI_CAL_* unset).
[env:xiao-esp32s3-lsm6dsox]
extends = env:esp32-s3
board = seeed_xiao_esp32s3
board_build.partitions = partitions/xiao-esp32s3-8mb.csv
build_flags =
	${env:esp32-s3.build_flags}
	-DOPENSKI_IMU_LSM6DSOX
	-DOPENSKI_IMU_SDA_PIN=5
	-DOPENSKI_IMU_SCL_PIN=6
	-DOPENSKI_HOSTNAME=\"ski-xiao\"
	-DOPENSKI_LOW_POWER_RADIO

[env:xiao-esp32s3-lsm6dsox-ota]
extends = env:xiao-esp32s3-lsm6dsox
upload_protocol = espota

; Left and right boot units. Both are the XIAO + LSM6DSOX build above with their own hostname. The left unit
; also carries a LIS3MDL magnetometer (0x1C, same I2C bus), streamed live only as movement frame version 5 in
; diagnostics mode; it is not recorded to flash. The right unit has no magnetometer.
[env:xiao-left-mag]
extends = env:xiao-esp32s3-lsm6dsox
build_flags =
	${env:esp32-s3.build_flags}
	-DOPENSKI_IMU_LSM6DSOX
	-DOPENSKI_IMU_SDA_PIN=5
	-DOPENSKI_IMU_SCL_PIN=6
	-DOPENSKI_HOSTNAME=\"ski-xiao-l\"
	-DOPENSKI_LOW_POWER_RADIO
	-DOPENSKI_MAG_LIS3MDL

[env:xiao-left-mag-ota]
extends = env:xiao-left-mag
upload_protocol = espota

[env:xiao-right]
extends = env:xiao-esp32s3-lsm6dsox
build_flags =
	${env:esp32-s3.build_flags}
	-DOPENSKI_IMU_LSM6DSOX
	-DOPENSKI_IMU_SDA_PIN=5
	-DOPENSKI_IMU_SCL_PIN=6
	-DOPENSKI_HOSTNAME=\"ski-xiao-r\"
	-DOPENSKI_LOW_POWER_RADIO

[env:xiao-right-ota]
extends = env:xiao-right
upload_protocol = espota

[env:esp32-devkit-v1]
extends = env:esp32-s3
board = esp32dev
build_flags = -std=gnu++17
board_build.partitions = partitions/esp32dev-4mb.csv

[env:esp32-devkit-v1-ota]
extends = env:esp32-devkit-v1
upload_protocol = espota

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17

; Opt-in research acquisition; bench-check before skiing or OTA deployment.
[env:esp32-devkit-v1-research]
extends = env:esp32-devkit-v1
build_flags = ${env:esp32-devkit-v1.build_flags} -DOPENSKI_RESEARCH_ACQUISITION

[env:esp32-s3-supermini-research]
extends = env:esp32-s3-supermini
build_flags = ${env:esp32-s3-supermini.build_flags} -DOPENSKI_RESEARCH_ACQUISITION

[env:esp32-s3-supermini-research-ota]
extends = env:esp32-s3-supermini-research
upload_protocol = espota

[env:esp32-s3-supermini-adc-diagnostic]
extends = env:esp32-s3-supermini
build_flags = ${env:esp32-s3-supermini.build_flags} -DOPENSKI_ADC_DIAGNOSTIC
